name: Sync Search Console data

on:
  schedule:
    # 09:23 UTC daily (~3-4am US Central), after Search Console's overnight update.
    - cron: "23 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gsc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Search Console data
        env:
          GSC_ACCOUNTS: ${{ secrets.GSC_ACCOUNTS }}
          GSC_SITES: ${{ vars.GSC_SITES }}
        run: node scripts/fetch-gsc.mjs

      - name: Commit data if changed
        # Runs even if some properties failed: the script keeps their last
        # good data, and everything else is still worth publishing.
        if: always()
        run: |
          [ -d data/gsc ] || { echo "No data written."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/gsc
          git diff --cached --quiet && echo "No data changes." || git commit -m "Update Search Console data $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
